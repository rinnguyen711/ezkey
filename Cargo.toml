[workspace]
resolver = "2"
members = ["core", "windows", "installer"]
# The installer embeds target/release/ezkey.exe, so it is built separately
# after ezkey-win (see README).
default-members = ["core", "windows"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
