[package]
name = "ezkey-win"
version = "0.1.0"
edition = "2021"
description = "ezkey Vietnamese Telex input for Windows (tray app + keyboard hook)"

[[bin]]
name = "ezkey"
path = "src/main.rs"

[dependencies]
ezkey-core = { path = "../core" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
